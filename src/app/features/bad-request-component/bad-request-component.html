<header class="menuBoard">
  <a routerLink="/shop" class="store-brand" aria-label="Gaming Store - home">
    <img src="/images/Logo.png" alt="">
    <span>Gaming Store</span>
  </a>
  <nav aria-label="Main navigation">
    <a routerLink="/shop" class="nav-link">Shop</a>
    <a routerLink="/shop" fragment="Products" class="nav-link">Products</a>
    <a routerLink="/contact" class="nav-link">Contact</a>
    <a routerLink="/about-us" class="nav-link">About us</a>
    <a routerLink="/cart" class="nav-link">Cart</a>
  </nav>
</header>

<main class="error-page">
  <section class="error-card" aria-labelledby="error-title">
    <div class="error-code" aria-hidden="true">
      <span>400</span>
      <span class="error-code-label">BAD REQUEST</span>
    </div>

    <div class="error-copy">
      <p class="eyebrow">SOMETHING WENT WRONG</p>
      <h1 id="error-title">We couldn't process that request</h1>
      <p class="error-description">
        The request may be invalid or incomplete. Please check the information and try again,
        or return to the shop to continue browsing.
      </p>
      <div class="error-actions">
        <a class="primary-action" routerLink="/shop">Back to shop</a>
        <a class="secondary-action" routerLink="/contact">Contact support</a>
      </div>
    </div>
  </section>
</main>
